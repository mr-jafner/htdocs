<div class="ai-tag" data-ai-level="{{LEVEL}}">
    <span class="ai-tag-chip" tabindex="0" role="button" aria-label="AI disclosure: {{TITLE}}">
        <span class="ai-tag-dot" aria-hidden="true"></span>{{CHIP}}
    </span>
    <div class="ai-tag-card" role="tooltip">
        <strong>{{TITLE}}</strong>
        <span class="ai-tag-desc">{{DESC}}</span>
        <span class="ai-tag-row"><b>Content</b>{{CONTENT}}</span>
        <span class="ai-tag-row"><b>Build &amp; formatting</b>{{BUILD}}</span>
    </div>
</div>
